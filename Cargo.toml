[package]
name = "llama3-goldy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "llama3.cuda TinyStories generator replicated on Goldy (CUDA / Metal)"
publish = false

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
goldy = { path = "../goldy", default-features = false, features = ["tensor"] }

[features]
default = []
cuda = ["goldy/cuda"]
metal = ["goldy/metal"]

[[bin]]
name = "llama3-goldy"
path = "src/main.rs"

[lib]
name = "llama3_goldy"
path = "src/lib.rs"
